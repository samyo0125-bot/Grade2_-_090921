<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>二上數學應用題特訓 - Level 1 & Level 2 題庫</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* 列印試卷專用排版規則 */
    @media print {
      .no-print { display: none !important; }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 13pt;
      }
      .print-header { display: block !important; }
      .sheet-grid {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 16px !important;
      }
      .sheet-card {
        border: 1px solid #94a3b8 !important;
        box-shadow: none !important;
        break-inside: avoid;
        padding: 14px !important;
        border-radius: 8px !important;
      }
      .explanation-box { display: none !important; }
      .print-calculation-space { display: block !important; }
    }

<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="no-print sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">

      <!-- 標題與標記 -->
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-sm">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-black text-slate-900 leading-tight">二上數學應用題特訓</h1>
            <span id="headerLevelTag" class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">
              Level 1 (基礎與進階標準題)
            </span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">二位數直式進退位加減、兩步驟情境解題與思維分析訓練</p>
        </div>
      </div>

      <!-- 工具功能按鈕 -->
      <div class="flex items-center flex-wrap gap-2 text-sm">
        <button id="toggleAllAnsBtn" onclick="toggleAllExplanations()" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 font-medium transition shadow-sm">
          <i class="fa-regular fa-eye mr-1"></i> <span id="toggleText">顯示全部解析</span>
        </button>
        <button onclick="checkAnswers()" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium shadow-sm transition">
          <i class="fa-solid fa-check-double mr-1"></i> 批改分數
        </button>
        <button onclick="resetAnswers()" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-600 font-medium transition shadow-sm">
          <i class="fa-solid fa-arrow-rotate-right mr-1"></i> 重置
        </button>
        <button onclick="window.print()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium shadow-sm transition">
          <i class="fa-solid fa-print mr-1"></i> 列印試卷
        </button>
      </div>
    </div>

    <div class="bg-slate-100/90 border-t border-slate-200 px-4 py-2.5">

        <!-- 級別切換 (Level 1 vs Level 2) -->
        <div class="flex items-center bg-white p-1 rounded-xl border border-slate-300 shadow-inner">
          <span class="text-xs font-bold text-slate-500 px-2 flex items-center">
            <i class="fa-solid fa-layer-group mr-1.5"></i> 級別選擇：
          </span>
          <button id="lvl-btn-l1" onclick="switchLevel('level1')" class="px-3.5 py-1 text-xs sm:text-sm rounded-lg font-bold transition bg-indigo-600 text-white shadow-sm">
            Level 1 (標準題)
          </button>
          <button id="lvl-btn-l2" onclick="switchLevel('level2')" class="px-3.5 py-1 text-xs sm:text-sm rounded-lg font-bold transition text-slate-600 hover:text-slate-900">
            Level 2 (思維辨析題)
          </button>
        </div>

        <!-- 運算分類按鈕 -->
        <div class="flex items-center gap-1.5 text-xs sm:text-sm overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
          <button onclick="filterCategory('all')" class="cat-btn active px-3.5 py-1 rounded-full bg-slate-800 text-white font-medium shadow-sm" data-cat="all">
            全部 (<span id="count-all">150</span>)
          </button>
          <button onclick="filterCategory('add')" class="cat-btn px-3.5 py-1 rounded-full bg-white text-slate-700 border border-slate-300 hover:bg-slate-200" data-cat="add">
            加法題 (<span id="count-add">50</span>)
          </button>
          <button onclick="filterCategory('sub')" class="cat-btn px-3.5 py-1 rounded-full bg-white text-slate-700 border border-slate-300 hover:bg-slate-200" data-cat="sub">
            減法題 (<span id="count-sub">50</span>)

            加減混合 (<span id="count-mix">50</span>)
          </button>
        </div>
      </div>
    </div>
  </header>

        </div>
        <div class="text-right text-sm text-slate-800 space-y-1">
          <div class="font-medium">二年 _____ 班  座號：_____  姓名：___________</div>

  </main>

    // 封裝載入至題庫物件
    function loadData() {
      l1AddRaw.forEach((item, idx) => {
        questionBank.level1.add.push({ id: idx + 1, cat: 'add', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });
      l1SubRaw.forEach((item, idx) => {
        questionBank.level1.sub.push({ id: idx + 1, cat: 'sub', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });
      l1MixRaw.forEach((item, idx) => {
        questionBank.level1.mix.push({ id: idx + 1, cat: 'mix', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });

      l2AddRaw.forEach((item, idx) => {
        questionBank.level2.add.push({ id: idx + 1, cat: 'add', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });
      l2SubRaw.forEach((item, idx) => {
        questionBank.level2.sub.push({ id: idx + 1, cat: 'sub', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });
      l2MixRaw.forEach((item, idx) => {
        questionBank.level2.mix.push({ id: idx + 1, cat: 'mix', q: item[0], ans: item[1], unit: item[2], exp: item[3] });
      });
    }

    loadData();

    // 狀態設定
    let currentLevel = 'level1';
    let currentCategory = 'all';
    let showAllState = false;

    // 渲染試卷卡片
    function renderWorksheet() {
      const container = document.getElementById("quizContainer");
      const levelData = questionBank[currentLevel];

      const btnL2 = document.getElementById("lvl-btn-l2");

      const printMainTitle = document.getElementById("printMainTitle");
      const printSubTitle = document.getElementById("printSubTitle");

      if (currentLevel === 'level1') {
        btnL1.className = "px-3.5 py-1 text-xs sm:text-sm rounded-lg font-bold transition bg-indigo-600 text-white shadow-sm";

        printMainTitle.innerText = "二年級上學期 數學應用題特訓卷 - Level 1";
        printSubTitle.innerText = "範圍：二位數加減法直式計算與兩步驟標準題型 (共 50 題)";
      } else {
        btnL2.className = "px-3.5 py-1 text-xs sm:text-sm rounded-lg font-bold transition bg-indigo-600 text-white shadow-sm";
        btnL1.className = "px-3.5 py-1 text-xs sm:text-sm rounded-lg font-bold transition text-slate-600 hover:text-slate-900";
        headerTag.className = "px-2.5 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-900 border border-amber-300";
        headerTag.innerHTML = `<i class="fa-solid fa-lightbulb text-amber-600 mr-1"></i> Level 2 (思維辨析題)`;
        printMainTitle.innerText = "二年級上學期 數學應用題特訓卷 - Level 2 (思維辨析)";
        printSubTitle.innerText = "範圍：二位數加減逆向思維、多餘條件辨識與綜合思考題型 (共 50 題)";
      }

      let displayList = [];
      if (currentCategory === 'all') {
        displayList = [...levelData.add, ...levelData.sub, ...levelData.mix];
      } else {
        displayList = [...levelData[currentCategory]];
      }

      document.getElementById("count-all").innerText = levelData.add.length + levelData.sub.length + levelData.mix.length;
      document.getElementById("count-add").innerText = levelData.add.length;
      document.getElementById("count-sub").innerText = levelData.sub.length;
      document.getElementById("count-mix").innerText = levelData.mix.length;

      container.innerHTML = "";

      displayList.forEach((item, index) => {
        const catBadgeMap = {

          mix: { text: "加減混合", color: "bg-purple-50 text-purple-700 border-purple-200" }

        const displayIndex = index + 1;

        const card = document.createElement("div");
        card.className = "sheet-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition hover:border-indigo-300";
        card.id = `card-${currentLevel}-${item.cat}-${item.id}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">

            <button onclick="toggleSingleExplanation('${currentLevel}', '${item.cat}', ${item.id})" class="no-print text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">

            <div class="flex items-center gap-2 flex-wrap">
              <label class="text-sm font-bold text-slate-700">你的答案：</label>
              <input type="number" id="input-num-${currentLevel}-${item.cat}-${item.id}" 
                class="w-24 px-3 py-1.5 border border-slate-300 rounded-xl text-center font-black text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base shadow-inner"

                onkeydown="if(event.key==='Enter') checkAnswers()">
              <input type="text" id="input-unit-${currentLevel}-${item.cat}-${item.id}" 
                class="w-20 px-2.5 py-1.5 border border-slate-300 rounded-xl text-center font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-inner"

            <div class="mt-1.5 pt-1.5 border-t border-indigo-200/60 font-bold text-slate-900">
              標準答案：<span class="text-indigo-600 font-black text-base underline decoration-indigo-400 decoration-2">${item.ans}</span> ${item.unit || ''}

      });
    }

    // ==========================================
    // 互動控制函式 (已完整補齊)
    // ==========================================

    // 切換級別 (Level 1 / Level 2)
    function switchLevel(level) {
      currentLevel = level;
      currentCategory = 'all';
      showAllState = false;
      document.getElementById("toggleText").innerText = "顯示全部解析";

      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === 'all') {
          btn.className = "cat-btn active px-3.5 py-1 rounded-full bg-slate-800 text-white font-medium shadow-sm";
        } else {
          btn.className = "cat-btn px-3.5 py-1 rounded-full bg-white text-slate-700 border border-slate-300 hover:bg-slate-200";
        }
      });

      document.getElementById("scoreBanner").classList.add("hidden");
      renderWorksheet();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 切換運算分類 (all / add / sub / mix)
    function filterCategory(cat) {
      currentCategory = cat;
      showAllState = false;
      document.getElementById("toggleText").innerText = "顯示全部解析";

      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-btn active px-3.5 py-1 rounded-full bg-slate-800 text-white font-medium shadow-sm";
        } else {
          btn.className = "cat-btn px-3.5 py-1 rounded-full bg-white text-slate-700 border border-slate-300 hover:bg-slate-200";
        }
      });

      document.getElementById("scoreBanner").classList.add("hidden");
      renderWorksheet();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 顯示或隱藏全部解析
    function toggleAllExplanations() {
      showAllState = !showAllState;
      const toggleText = document.getElementById("toggleText");
      toggleText.innerText = showAllState ? "隱藏全部解析" : "顯示全部解析";

      const levelData = questionBank[currentLevel];
      let currentList = [];
      if (currentCategory === 'all') {
        currentList = [...levelData.add, ...levelData.sub, ...levelData.mix];
      } else {
        currentList = [...levelData[currentCategory]];
      }

      currentList.forEach(item => {
        const expBox = document.getElementById(`explain-${currentLevel}-${item.cat}-${item.id}`);
        if (expBox) {
          if (showAllState) {
            expBox.classList.remove("hidden");
          } else {
            expBox.classList.add("hidden");
          }
        }
      });
    }

    // 切換單一題目的解析提示
    function toggleSingleExplanation(lvl, cat, id) {
      const expBox = document.getElementById(`explain-${lvl}-${cat}-${id}`);
      if (expBox) {
        expBox.classList.toggle("hidden");
      }
    }

    // 重置所有填答
    function resetAnswers() {
      const levelData = questionBank[currentLevel];
      const allItems = [...levelData.add, ...levelData.sub, ...levelData.mix];

      allItems.forEach(item => {
        const inputNum = document.getElementById(`input-num-${currentLevel}-${item.cat}-${item.id}`);
        const inputUnit = document.getElementById(`input-unit-${currentLevel}-${item.cat}-${item.id}`);
        const icon = document.getElementById(`result-icon-${currentLevel}-${item.cat}-${item.id}`);
        const card = document.getElementById(`card-${currentLevel}-${item.cat}-${item.id}`);
        const exp = document.getElementById(`explain-${currentLevel}-${item.cat}-${item.id}`);

        if (inputNum) inputNum.value = "";
        if (inputUnit) inputUnit.value = "";
        if (icon) {
          icon.innerHTML = "";
          icon.className = "ml-2 text-xs font-bold hidden";
        }
        if (card) card.classList.remove("border-rose-400", "border-emerald-400", "bg-rose-50/20");
        if (exp && !showAllState) exp.classList.add("hidden");
      });
      document.getElementById("scoreBanner").classList.add("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 批改評分
    function checkAnswers() {
      let correctCount = 0;
      let attemptedCount = 0;
      const levelData = questionBank[currentLevel];
      let currentList = [];

      if (currentCategory === 'all') {
        currentList = [...levelData.add, ...levelData.sub, ...levelData.mix];
      } else {
        currentList = [...levelData[currentCategory]];
      }

      currentList.forEach(item => {
        const inputNum = document.getElementById(`input-num-${currentLevel}-${item.cat}-${item.id}`);
        const inputUnit = document.getElementById(`input-unit-${currentLevel}-${item.cat}-${item.id}`);
        const icon = document.getElementById(`result-icon-${currentLevel}-${item.cat}-${item.id}`);
        const card = document.getElementById(`card-${currentLevel}-${item.cat}-${item.id}`);

        if (inputNum && inputNum.value.trim() !== "") {
          attemptedCount++;
          const val = parseInt(inputNum.value.trim(), 10);
          const unitVal = inputUnit ? inputUnit.value.trim() : "";
          
          const isNumCorrect = (val === item.ans);
          const isUnitCorrect = !item.unit || (unitVal === item.unit);

          if (isNumCorrect && isUnitCorrect) {
            correctCount++;
            if (icon) {
              icon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> 正確 (${val}${item.unit || ''})`;
              icon.className = "ml-2 text-xs font-bold text-emerald-600 inline-flex items-center gap-1";
            }
            if (card) {
              card.classList.remove("border-rose-400", "bg-rose-50/20");
              card.classList.add("border-emerald-300");
            }
          } else {
            let errorMsg = "算錯了";
            if (isNumCorrect && !isUnitCorrect) {
              errorMsg = `數字對了，但單位應為「${item.unit}」`;
            } else if (!isNumCorrect && isUnitCorrect) {
              errorMsg = "數字算錯了";
            } else {
              errorMsg = "算錯了 (請檢查計算與單位)";
            }

            if (icon) {
              icon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-500"></i> ${errorMsg}`;
              icon.className = "ml-2 text-xs font-bold text-rose-600 inline-flex items-center gap-1";
            }
            if (card) {
              card.classList.remove("border-emerald-300");
              card.classList.add("border-rose-400", "bg-rose-50/20");
            }
            const exp = document.getElementById(`explain-${currentLevel}-${item.cat}-${item.id}`);
            if (exp) exp.classList.remove("hidden");
          }
        }
      });

      const banner = document.getElementById("scoreBanner");
      const scoreText = document.getElementById("scoreText");
      const scoreBadge = document.getElementById("scoreBadge");

      banner.classList.remove("hidden");
      if (attemptedCount === 0) {
        scoreText.innerHTML = `尚未填寫任何題目，請在題目下方的輸入框填入計算答案與單位後再點擊批改！`;
        scoreBadge.innerText = `0 分`;
      } else {
        const score = Math.round((correctCount / currentList.length) * 100);
        scoreText.innerHTML = `目前分類共 <b>${currentList.length}</b> 題，已作答 <b>${attemptedCount}</b> 題，答對 <b>${correctCount}</b> 題。${score >= 80 ? '數字與單位掌握得非常好，運算正確率很高！' : '請參考標示紅框題目的解題思維與算式，再算一次喔！'}`;
        scoreBadge.innerText = `${score} 分`;
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 頁面初始化加載
    window.addEventListener("DOMContentLoaded", () => {
      renderWorksheet();
    });
  </script>
</body>
</html>
